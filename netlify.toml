[build]
  command = "npm run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/swagger"
  to = "/.netlify/functions/api/swagger"
  status = 200

[[redirects]]
  from = "/swagger/*"
  to = "/.netlify/functions/api/swagger/:splat"
  status = 200

[[redirects]]
  from = "/api-docs"
  to = "/.netlify/functions/api/api-docs"
  status = 200

[[redirects]]
  from = "/swagger.json"
  to = "/.netlify/functions/api/swagger.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
